version: '3.9'

services:
  #--------------------------------------------------------------------------
  # PostgreSQL - Primary database
  #--------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: grantdesk
      POSTGRES_USER: grantdesk
      POSTGRES_PASSWORD: grantdesk_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  #--------------------------------------------------------------------------
  # Redis - Caching and session storage
  #--------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
